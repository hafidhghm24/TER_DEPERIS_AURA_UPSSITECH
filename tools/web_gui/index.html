<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cockpit ExoMy</title>

    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>

    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #4CAF50; }
        .controls-container {
            margin: 10px auto;
            padding: 15px;
            background-color: #2d2d2d;
            border-radius: 10px;
            display: inline-block;
        }
        select {
            padding: 10px; font-size: 16px; border-radius: 5px;
            background-color: #333; color: white; border: 1px solid #4CAF50;
        }
        
        .stereo-container {
            display: flex; justify-content: center; gap: 15px;
            margin: 15px auto; max-width: 1000px;
        }
        .depth-container {
            display: flex; justify-content: center; margin: 10px auto 20px auto;
        }
        .eye-view {
            width: 500px; background-color: #000; border: 3px solid #4CAF50;
            border-radius: 10px; overflow: hidden; position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); min-height: 375px;
        }
        .eye-view::after {
            content: attr(data-eye); position: absolute; top: 5px; left: 10px;
            color: #4CAF50; font-weight: bold; text-shadow: 1px 1px 3px black;
            background: rgba(0,0,0,0.5); padding: 2px 5px; border-radius: 3px;
        }
        .eye-stream { width: 100%; display: block; }
        
        .mode-controls { margin: 15px auto; }
        .mode-btn {
            background-color: #333; color: white; border: 1px solid #4CAF50;
            padding: 10px 15px; margin: 0 5px; border-radius: 5px;
            cursor: pointer; transition: 0.3s; font-size: 14px;
        }
        .mode-btn.active, .mode-btn:hover {
            background-color: #4CAF50; color: #000; font-weight: bold;
        }

        #joystick-zone {
            width: 250px; height: 250px; background-color: #333;
            border-radius: 50%; margin: 10px auto; position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .status { font-weight: bold; margin-bottom: 10px; }
        .connected { color: #4CAF50; }
        .disconnected { color: #f44336; }
    </style>
</head>
<body>

    <h1>🚀 Cockpit de Pilotage ExoMy</h1>
    
    <div class="status" id="connection-status" class="disconnected">🔌 Déconnecté de ROS 2</div>

    <div class="controls-container">
        <label for="robot-select">Sélectionner le robot à piloter : </label>
        <select id="robot-select" onchange="changeRobot()">
            <option value="exo1">ExoMy 1 (Cartographe)</option>
            <option value="exo2">ExoMy 2 (Explorateur)</option>
        </select>
    </div>

    <div class="stereo-container">
        <div class="eye-view" data-eye="👁️ ŒIL GAUCHE">
            <img id="camera-left" class="eye-stream" src="" alt="En attente du flux..." />
        </div>
        <div class="eye-view" data-eye="👁️ ŒIL DROIT">
            <img id="camera-right" class="eye-stream" src="" alt="En attente du flux..." />
        </div>
    </div>

    <div class="depth-container">
        <div class="eye-view" data-eye="🗺️ CARTE DE PROFONDEUR">
            <img id="camera-depth" class="eye-stream" src="" alt="En attente de la carte..." />
        </div>
    </div>

    <div class="mode-controls">
        <p>Mode de déplacement :</p>
        <button id="btn-mode-1" class="mode-btn active" onclick="setLocomotionMode(1)">🚗 Normal (Ackermann)</button>
        <button id="btn-mode-2" class="mode-btn" onclick="setLocomotionMode(2)">🔄 Rotation sur place</button>
        <button id="btn-mode-3" class="mode-btn" onclick="setLocomotionMode(3)">🦀 Marche en Crabe</button>
    </div>

    <p>Joystick de pilotage</p>
    <div id="joystick-zone"></div>

    <script>
        const ROSBRIDGE_URL = 'ws://localhost:9090'; 
        const VIDEO_SERVER_URL = 'http://localhost:8080/stream?topic=';

        let currentRobot = 'exo1';
        let currentVel = 0;
        let currentSteering = 90; 
        let currentLocomotionMode = 1; 
        let publishInterval = null;
        let cmdVelTopic = null;
        
        var ros = new ROSLIB.Ros({ url : ROSBRIDGE_URL });

        ros.on('connection', function() {
            document.getElementById('connection-status').innerHTML = '✅ Connecté à ROS 2';
            document.getElementById('connection-status').className = 'status connected';
            
            if(publishInterval) clearInterval(publishInterval);
            publishInterval = setInterval(publishCommand, 100); 
            
            changeRobot(); 
        });

        ros.on('error', function(error) {
            document.getElementById('connection-status').innerHTML = '❌ Erreur de connexion';
            document.getElementById('connection-status').className = 'status disconnected';
        });

        ros.on('close', function() {
            document.getElementById('connection-status').innerHTML = '🔌 Déconnecté';
            document.getElementById('connection-status').className = 'status disconnected';
            if(publishInterval) clearInterval(publishInterval);
        });

        function changeRobot() {
            currentRobot = document.getElementById('robot-select').value;
            
            // Mise à jour des flux vidéo
            document.getElementById('camera-left').src = VIDEO_SERVER_URL + `/${currentRobot}/left_cam/image_raw`;
            document.getElementById('camera-right').src = VIDEO_SERVER_URL + `/${currentRobot}/right_cam/image_raw`;
            
            // Gestion de l'image de profondeur (Si le robot n'a pas de noeud disparity, on met une image vide)
            let depthImg = document.getElementById('camera-depth');
            depthImg.src = VIDEO_SERVER_URL + `/${currentRobot}/disparity_image`;
            depthImg.onerror = function() {
                this.src = ''; 
                this.alt = "Profondeur non calculée par ce robot";
            };

            // Mise à jour du topic de commande moteur
            cmdVelTopic = new ROSLIB.Topic({
                ros : ros,
                name : `/${currentRobot}/rover_command`,
                messageType : 'exomy_msgs/msg/RoverCommand'
            });
        }

        function setLocomotionMode(mode) {
            currentLocomotionMode = mode;
            document.getElementById('btn-mode-1').className = 'mode-btn' + (mode === 1 ? ' active' : '');
            document.getElementById('btn-mode-2').className = 'mode-btn' + (mode === 2 ? ' active' : '');
            document.getElementById('btn-mode-3').className = 'mode-btn' + (mode === 3 ? ' active' : '');
        }

        function publishCommand() {
            if (!cmdVelTopic) return;
            var cmd = new ROSLIB.Message({
                connected: true,
                motors_enabled: true,
                locomotion_mode: currentLocomotionMode,
                vel: currentVel,
                steering: currentSteering,
                force_stop: false
            });
            cmdVelTopic.publish(cmd);
        }

        // --- JOYSTICK ---
        var joystickZone = document.getElementById('joystick-zone');
        var manager = nipplejs.create({
            zone: joystickZone,
            mode: 'dynamic', 
            color: '#4CAF50',
            size: 150
        });

        manager.on('move', function (evt, data) {
            if (!data.vector) return; 
            currentVel = Math.round(data.vector.y * 100);
            currentSteering = Math.round(90 + (data.vector.x * 90));
        });

        manager.on('end', function () {
            currentVel = 0;
            currentSteering = 90;
        });
    </script>
</body>
</html>
